<div id="app"><noscript><h1>成都 Chengdu</h1><p>影像營的七天，從五鳳溪古鎮、西嶺雪山一路拍到熊貓。</p><ul><li>梅枝上的紅花，背景一片柔焦</li><li>昏暗殿內，掛著油燈的楹聯</li><li>粉色梅花環繞的多層古塔</li><li>武侯祠「業紹高光」匾額下，香客正在上香</li><li>同一座殿前的香爐與石板地</li><li>暗處一尊龍形雕飾</li><li>昏暗殿內的坐像，上方掛著匾額</li><li>枝頭盛開的紅梅</li><li>灰白天空下，枯枝上停著一隻鳥</li><li>一整面亮著的紙燈籠</li><li>夜裡亮起彩色燈光的雙子塔</li><li>竹叢間探出頭的大熊貓</li><li>埋頭吃竹子的大熊貓</li><li>趴在樹枝上的大熊貓</li><li>攤位上一格格排好的串珠與手鍊</li><li>蒸籠裡冒著熱氣的小點心</li><li>夜裡亮燈的安順廊橋倒映在江面</li><li>西嶺雪山的纜車車廂</li><li>結霜的松枝，像撒了一層糖霜</li><li>霧凇樹幹上的一隻松鼠</li><li>濃霧裡結霜的杉樹</li><li>灰濛天色下的高樓與天橋</li><li>草地上的大字，幾個小孩在踢球</li><li>掛滿紅燈籠的石階，遊客穿梭其中</li><li>「今朝有戲」招牌下賣橘子的大爺</li><li>紅葉樹旁的龍吟天城古建築</li><li>穿著衣服的白色小狗，坐在主人腳邊</li><li>掛著燈籠的紅樹</li><li>河邊步道，紅色燈柱一路延伸</li><li>紅黑相間的層疊屋簷</li><li>石階上探頭的黑白貓</li></ul></noscript></div>
