<div id="app"><noscript><h1>首爾 Seoul</h1><p>冬天的首爾：宮殿、韓屋與首爾塔，梨花女大的光影，還有一路吃不完的麵包。</p><ul><li>從機窗往下看，覆雪的山地與河流</li><li>飛往首爾途中，窗外的機翼與地平線</li><li>夜裡遠方亮著的樂天世界塔與城市燈火</li><li>藍天下的光化門</li><li>韓屋屋簷後方，遠處的南山首爾塔</li><li>枝葉框住的南山塔與韓屋屋頂</li><li>Artist Bakery 鐵桶裡插滿的紙捲</li><li>Artist Bakery 一盤盤剛出爐的可頌</li><li>架上排滿的可頌與鹽麵包</li><li>黃、黑兩色的可頌並排在木盤裡</li><li>草莓奶油麵包配一杯花茶</li><li>兩個人走過布滿紋理的牆面</li><li>梨花女大的階梯，紅衣行人走在光影之間</li><li>從另一個角度看梨花女大的階梯與盆栽</li><li>峽谷盡頭，遠處的梨花女大舊校舍</li><li>樓梯間裡，陽光一道道落在階梯上</li><li>冬日樹影落在梨花女大的老校舍牆上</li><li>倫敦貝果博物館的椒鹽奶油貝果</li><li>一整櫃貝果，牌子寫著各種口味</li><li>提著倫敦貝果博物館的紙袋</li><li>傍晚的漢江，陽光在大樓玻璃上反射</li><li>夕陽下的江畔公寓，遠處是南山塔</li><li>粉紫色天空下的南山塔與公寓</li><li>宮殿正殿的門與台階，匾額寫著「中和殿」</li><li>藍天下的松枝與宮殿屋簷</li><li>星空圖書館高聳的書牆與玻璃天頂</li><li>從高處看漢江上的一座座橋</li><li>漢江上的斜張橋與倒影</li><li>俯瞰漢江的長橋，畫面斜斜切過</li><li>藍天下，山頂上的南山塔</li><li>上午的天際線，樂天世界塔立在中間</li><li>從牆洞望出去，遠方的樂天世界塔</li><li>枯枝上停著一隻鳥，遠處是南山塔</li></ul></noscript></div>
