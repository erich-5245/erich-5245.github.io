<div id="app"><noscript><h1>泉州・福州 Quanzhou &amp; Fuzhou</h1><p>梅竹書院第六屆，帶著 GR IIIx 在泉州與福州之間走走拍拍。</p><ul><li>木桌上的 GR IIIx，這趟旅程的隨身相機</li><li>傍晚點亮的鏤空燈塔裝置，襯著漸暗的天空</li><li>夜色裡遠遠亮著燈的城堡造型建築</li><li>色彩繁複的彩繪玻璃天花板，滿版的花紋</li><li>從暗房間的窗框望出去，海面與跨海大橋</li><li>陽台欄杆後方，遠處的城堡尖塔與圓頂</li><li>藍天白雲下的開元寺東塔，一旁是老街店舖</li><li>從路口望向西塔，電線和樹梢橫過天空</li><li>閩台緣博物館展櫃裡的一口古銅鐘</li><li>「四十多年了，放我回家吧！」</li><li>藍天下的閩台緣博物館</li><li>午後的海灣，遠方橫著一長條跨海大橋</li><li>逆光的海面閃著銀光，大橋成了一道剪影</li><li>藍天下，紅白相間的弧形洋樓轉角</li><li>只拍水面，細細的波紋鋪滿整個畫面</li><li>橘紅色的夕陽，正落在對岸的天際線上</li><li>夜晚的海灘上，一座被打亮的海螺雕塑</li><li>靠近看海螺雕塑的曲線與孔洞，背後是夜海</li><li>瑞幸咖啡門口發光的藍色鹿頭招牌</li><li>高樓之間，路燈桿上掛著兩面五星旗</li><li>寥寥無幾的候機大廳，被福州的夕陽填滿</li></ul></noscript></div>
