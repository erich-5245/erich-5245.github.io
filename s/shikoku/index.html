<div id="app"><noscript><h1>四國 Shikoku</h1><p>和家人走過香川、德島、愛媛與小豆島，把旅途裡的片刻放慢來看。</p><ul><li>山腳下一台紅色的販賣機</li><li>綠蔭下的金刀比羅宮參道，遊客撐著傘往上走</li><li>石鳥居上的「金」字紋，金刀比羅宮的標誌</li><li>藍天下飄揚的金刀比羅宮旗幟</li><li>掛著「金」字白燈籠的社殿一角</li><li>樹林環繞的木造社殿與迴廊</li><li>兩旁樹蔭夾道的石板參道</li><li>用藤蔓編成的祖谷葛藤橋</li><li>從葛藤橋的縫隙往下看，底下是碧綠溪水</li><li>從暗處望向葛藤橋，藤蔓垂在兩側</li><li>大步危峽谷間湍急的溪流</li><li>白色岩層間翻起浪花的急流</li><li>灰白色的岩壁直直落進碧綠河水</li><li>遊船駛過大步危峽谷的河面</li><li>岩壁上的細瀑匯進翻騰的溪流</li><li>站在岩石上的一隻鸕鶿</li><li>一整面排列整齊的彩色紗線軸</li><li>近拍線軸，前景清晰、後方漸漸模糊</li><li>暖色的線軸一層層往上疊</li><li>線軸小屋裡，唯一一顆燈泡</li><li>掛在線軸前的糊塗塌客毛巾</li><li>掛在線軸前的史努比毛巾</li><li>昏黃燈光下，桌上準備烤的肉</li><li>夜裡停在商店街口的計程車</li><li>夜裡亮著頭燈的計程車</li><li>商店街裡擠成一排的腳踏車</li><li>樹叢後露出的松山城天守</li><li>松山城的木門後方，石牆與長長的石階</li><li>松山城層疊的灰瓦屋頂</li><li>從松山城往下看，整片松山市區</li><li>從暗處斜斜框住的天守一角</li><li>從牆縫望出去，遠處的摩天輪</li><li>一整面擺滿的扭蛋機</li><li>窗邊掛成一串的橘色娃娃</li><li>停在車站月台的路面電車</li><li>道後溫泉本館的入口與屋簷</li><li>街口舉起手機拍照的路人</li><li>鳥居後方長長的石階，盡頭是紅色樓門</li><li>等紅燈的單車騎士，頭上電線縱橫</li><li>港邊的高塔大樓與碼頭</li><li>小豆島橄欖公園的希臘風車</li><li>沿著海岸彎進小鎮的公路</li><li>樹林間的觀景台，遠處是瀨戶內海</li><li>下午港灣裡停靠的帆船</li><li>池水與松林環繞的日式庭園</li><li>近看盤曲的松樹枝幹</li><li>一枝松樹探向平靜的池面</li><li>荷葉之間開著一朵粉色荷花</li><li>池畔的茶亭與修剪過的松樹</li></ul></noscript></div>
