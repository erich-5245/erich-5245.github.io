<div id="app"><noscript><h1>大邱・釜山・慶州 Daegu, Busan &amp; Gyeongju</h1><p>九月的慶尚道：大邱的街頭、釜山的海、慶州的古寺，最後回到釜山的甘川洞。</p><ul><li>電線交錯的街道</li><li>城市後方的電視塔</li><li>雙尖塔的紅磚教堂</li><li>韓屋造型的星巴克</li><li>霓虹招牌亮起的夜街</li><li>海鮮市場兩側的商家，遠處是釜山的高樓</li><li>街邊整排的韓文招牌</li><li>霧氣籠罩的海岸</li><li>薄霧裡若隱若現的海岸線</li><li>沙灘上的小孩</li><li>海邊的佛塔</li><li>掛滿彩色燈籠的寺院</li><li>伸向海面的觀景台</li><li>青沙埔站下延伸的鐵軌</li><li>港口的紅白燈塔</li><li>雲層下的天空膠囊列車</li><li>高架軌道下的黃色海岸列車</li><li>海面上的礁石</li><li>木欄杆外的大海</li><li>浪打在岩岸上</li><li>站在礁石頂的海鷗</li><li>遠處防波堤上的紅燈塔</li><li>消波塊上的紅燈塔與遠方工廠</li><li>貼著海面飛過的海鷗</li><li>駛過海面的漁船</li><li>掛滿祈福牌的寺院門口</li><li>松樹下的寺院屋簷</li><li>門框裡框住的另一座殿</li><li>石欄杆與彩繪屋簷</li><li>遠山下的河與古村</li><li>水邊的韓式樓閣</li><li>橫過溪水的踏石</li><li>河面倒映著月精橋</li><li>甘川洞文化村</li><li>山坡上密密麻麻的彩色房子</li><li>坐在巷口的黑白貓</li></ul></noscript></div>
